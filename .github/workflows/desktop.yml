name: Application de bureau

# Génère l'installateur Windows (et une version portable) :
# - à la demande (onglet Actions → « Application de bureau » → Run workflow) ;
#   en renseignant « Version à publier » (ex. v1.1.0), le tag et la Release GitHub sont créés ;
# - ou en poussant un tag v* (ex. v1.1.0), qui crée aussi une Release GitHub.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version à publier (ex. v1.1.0) — laisser vide pour un simple test'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      # Jeton (secret) autorisé à publier sur le dépôt public des versions, lu par la mise à jour automatique.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RELEASES_REPO: benjamin-ct/F1_Dash-releases
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Numéro de version de l'appli = tag publié
        if: startsWith(env.RELEASE_TAG, 'v')
        shell: bash
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: F1-Dash-Windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(env.RELEASE_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: F1 Dash ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: desktop/dist/*.exe
          body: |
            Application Windows de F1 Dash.
            - **F1-Dash-…-portable.exe** : se lance directement, sans installation.
            - **F1-Dash-…-x64-win.exe** : installateur (raccourci « F1 Dash »).

            Windows peut afficher un avertissement SmartScreen (application non signée) : « Informations complémentaires » → « Exécuter quand même ».
      - name: Publication sur le dépôt public (mise à jour automatique)
        if: startsWith(env.RELEASE_TAG, 'v') && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: F1 Dash ${{ env.RELEASE_TAG }}
          make_latest: true
          files: desktop/dist/*.exe
          body: |
            Application Windows de F1 Dash — installateur et version portable.
            L'application installée se met à jour toute seule à partir de cette page.
      - name: Avertissement si le dépôt public n'est pas configuré
        if: startsWith(env.RELEASE_TAG, 'v') && env.RELEASES_TOKEN == ''
        shell: bash
        run: echo "::warning::Secret RELEASES_TOKEN absent — version non publiée sur ${RELEASES_REPO} (pas de mise à jour automatique). Voir README."
